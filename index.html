<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<title>便携收银台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M58 56v80M78 56v80M98 56v80M118 56v80M138 56v80'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Sora:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --ink:#0c1726;
  --ink-2:#3b4a5f;
  --muted:#8294a6;
  --line:#e7edf3;
  --primary:#0f766e;
  --primary-d:#0b5651;
  --primary-soft:#d3f0ec;
  --accent:#f59e0b;
  --accent-d:#d97706;
  --danger:#e5484d;
  --danger-soft:#fde8e8;
  --ok:#16a34a;
  --shadow:0 2px 10px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.16);
  --radius:18px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:"JetBrains Mono","Sora",monospace;font-feature-settings:"tnum"}
.display{font-family:"Sora","Noto Sans SC",sans-serif}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);
  color:#fff;
}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.topbar .logo svg{width:18px;height:18px}
.topbar h1{font-family:"Sora",sans-serif;font-size:18px;font-weight:700;letter-spacing:.5px}
.topbar .tag{font-size:11px;opacity:.8;font-weight:500}
.topbar .clock{font-family:"JetBrains Mono",monospace;font-size:13px;opacity:.9;font-weight:500}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.view{display:none;padding:16px}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 收银台 ============ */
.total-banner{
  background:var(--surface);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.total-banner::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 40%,var(--primary-soft) 100%);
  opacity:.5;
}
.total-banner>div{position:relative}
.total-banner .label{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:1px;text-transform:uppercase}
.total-banner .amount{font-family:"Sora",sans-serif;font-size:34px;font-weight:800;color:var(--primary);line-height:1.1;margin-top:4px}
.total-banner .amount .cur{font-size:18px;font-weight:600;opacity:.7;margin-right:3px}
.total-banner .count{font-size:13px;color:var(--ink-2);text-align:right}
.total-banner .count b{font-family:"JetBrains Mono",monospace;font-size:22px;color:var(--ink);font-weight:700}

.scan-btn{
  width:100%;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);
  color:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:17px;font-weight:700;letter-spacing:1px;
  box-shadow:0 8px 22px rgba(15,118,110,.32);
  transition:transform .12s;
  margin-bottom:12px;
}
.scan-btn:active{transform:scale(.97)}
.scan-btn svg{width:22px;height:22px}

.manual-row{display:flex;gap:8px;margin-bottom:18px}
.manual-row input{
  flex:1;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;background:var(--surface);outline:none;transition:border .15s;
}
.manual-row input:focus{border-color:var(--primary)}
.manual-row button{
  padding:0 18px;background:var(--ink);color:#fff;border-radius:12px;
  font-weight:600;font-size:14px;white-space:nowrap;
}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
.section-title h2{font-size:14px;color:var(--ink-2);font-weight:600;letter-spacing:.5px}
.section-title .clear{font-size:12px;color:var(--danger);padding:4px 8px}

.cart{display:flex;flex-direction:column;gap:10px}
.cart-item{
  background:var(--surface);border-radius:14px;padding:14px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:stretch;
  animation:slidein .25s ease;
}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cart-item .info{flex:1;min-width:0}
.cart-item .name{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .code{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.cart-item .price-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.price-edit{
  border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;
  font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;color:var(--primary);
  width:90px;text-align:right;outline:none;background:#fff;
}
.price-edit:focus{border-color:var(--primary)}
.cart-item .qty{display:flex;align-items:center;gap:0;background:var(--bg);border-radius:8px;overflow:hidden}
.cart-item .qty button{width:30px;height:30px;font-size:16px;font-weight:700;color:var(--ink-2);display:grid;place-items:center}
.cart-item .qty button:active{background:var(--line)}
.cart-item .qty span{min-width:28px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px}
.cart-item .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.cart-item .subtotal{font-family:"Sora",sans-serif;font-weight:700;font-size:16px;color:var(--ink)}
.cart-item .del{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--danger);background:var(--danger-soft)}
.cart-item .del:active{transform:scale(.9)}
.cart-item .del svg{width:16px;height:16px}

.remark-box{margin-top:16px}
.remark-box textarea{
  width:100%;min-height:60px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:14px;background:var(--surface);outline:none;resize:none;font-family:inherit;
}
.remark-box textarea:focus{border-color:var(--primary)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.4;margin-bottom:14px}
.empty h3{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.empty p{font-size:13px}

/* ============ 结算条 ============ */
.checkout-bar{
  position:absolute;bottom:56px;left:0;right:0;max-width:560px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px;padding-bottom:max(12px,calc(var(--safe-bottom) + 0px));
  display:flex;gap:12px;align-items:center;
  box-shadow:0 -4px 20px rgba(15,23,42,.08);
  z-index:20;
}
.checkout-bar .total{flex:1}
.checkout-bar .total .l{font-size:11px;color:var(--muted)}
.checkout-bar .total .v{font-family:"Sora",sans-serif;font-weight:800;font-size:22px;color:var(--primary)}
.checkout-bar .pay-btn{
  padding:14px 28px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);
  color:#fff;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 18px rgba(245,158,11,.4);transition:transform .12s;
}
.checkout-bar .pay-btn:active{transform:scale(.96)}
.checkout-bar .pay-btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-bottom);z-index:30;
}
.bottom-nav button{
  flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:500;transition:color .15s;
}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active svg{transform:translateY(-1px)}

/* ============ 订单页 ============ */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .export{flex:1;min-width:130px;padding:12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);border:1.5px solid var(--line)}
.toolbar .export:active{transform:scale(.97)}
.toolbar .export svg{width:17px;height:17px}
.toolbar .export.xsl{color:#16a34a;border-color:#bbf7d0}
.toolbar .export.csv{color:#2563eb;border-color:#bfdbfe}
.toolbar .export.clear{color:var(--danger);border-color:#fecaca;flex:0 0 auto;padding:12px 14px}

.orders{display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.order-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.order-head .oid{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.order-head .time{font-size:13px;font-weight:600;color:var(--ink-2)}
.order-head .total{font-family:"Sora",sans-serif;font-weight:800;font-size:18px;color:var(--primary)}
.order-body{padding:0 16px 14px;display:none;border-top:1px dashed var(--line)}
.order-card.open .order-body{display:block;padding-top:12px}
.order-body .item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-2)}
.order-body .item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.order-body .item .qt{color:var(--muted);font-family:"JetBrains Mono",monospace}
.order-body .item .pr{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--ink);min-width:70px;text-align:right}
.order-body .rm{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--ink-2)}
.order-body .rm b{color:var(--accent-d)}
.order-toggle{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.order-card.open .order-toggle{transform:rotate(180deg)}
.order-toggle svg{width:16px;height:16px}

.stats{display:flex;gap:10px;margin-bottom:14px}
.stats .st{flex:1;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stats .st .l{font-size:11px;color:var(--muted);font-weight:500}
.stats .st .v{font-family:"Sora",sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin-top:2px}
.stats .st .v.acc{color:var(--primary)}

/* ============ 商品页 ============ */
.search-row{position:relative;margin-bottom:14px}
.search-row svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search-row input{width:100%;padding:13px 16px 13px 42px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--surface);outline:none}
.search-row input:focus{border-color:var(--primary)}
.prod-count{font-size:12px;color:var(--muted);margin:0 4px 10px}
.prod-count b{color:var(--ink-2);font-family:"JetBrains Mono",monospace}
.products{display:flex;flex-direction:column;gap:8px}
.prod-card{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.prod-card .pd{flex:1;min-width:0}
.prod-card .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card .pc{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;margin-top:1px}
.prod-card .pp{font-family:"Sora",sans-serif;font-weight:700;font-size:17px;color:var(--primary)}
.prod-card .add{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.prod-card .add:active{transform:scale(.9)}
.prod-card .add svg{width:18px;height:18px}

/* ============ 扫码弹窗 ============ */
.scan-modal{
  position:fixed;inset:0;background:#000;z-index:100;display:none;
  flex-direction:column;
}
.scan-modal.show{display:flex}
.scan-modal .cam{flex:1;position:relative;overflow:hidden}
.scan-modal .cam video,.scan-modal .cam canvas{width:100%;height:100%;object-fit:cover}
.scan-frame{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80%;height:35%;max-width:340px;
  border-radius:14px;
}
.scan-frame::before,.scan-frame::after{
  content:"";position:absolute;width:34px;height:34px;border:4px solid var(--accent);
}
.scan-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
.scan-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 14px 0}
.scan-frame .laser{
  position:absolute;left:8%;right:8%;height:2px;background:var(--accent);
  box-shadow:0 0 12px var(--accent);animation:laser 1.8s ease-in-out infinite;
}
@keyframes laser{0%,100%{top:12%}50%{top:88%}}
.scan-modal .top-bar{position:absolute;top:0;left:0;right:0;padding:max(16px,env(safe-area-inset-top)) 18px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.scan-modal .top-bar .tt{color:#fff;font-weight:600;font-size:16px}
.scan-modal .top-bar .close{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px)}
.scan-modal .top-bar .close svg{width:18px;height:18px}
.scan-modal .hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px}
.scan-modal .torch{position:absolute;bottom:max(80px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 22px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:24px;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.scan-modal .torch svg{width:16px;height:16px}

/* ============ Toast ============ */
.toast-wrap{position:fixed;top:max(70px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:max-content;max-width:90%}
.toast{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:tin .3s ease}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
.toast.info{background:var(--ink)}
.toast svg{width:17px;height:17px}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ============ Modal ============ */
.modal-bg{position:fixed;inset:0;background:rgba(12,23,38,.5);z-index:150;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px;padding-bottom:max(20px,calc(var(--safe-bottom) + 20px));animation:sup .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:"Sora",sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.sheet .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet .row:last-of-type{border-bottom:none}
.sheet .row .v{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink)}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:15px}
.sheet .cancel{background:var(--bg);color:var(--ink-2)}
.sheet .confirm{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);color:#fff}
.sheet .confirm:active{transform:scale(.97)}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7v10M9 7v10M13 7v10M17 7v10"/></svg></div>
      <div>
        <h1>便携收银台</h1>
        <div class="tag">SCAN · SELL · EXPORT</div>
      </div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <!-- 主区 -->
  <main class="main">
    <!-- ===== 收银台 ===== -->
    <section class="view active" id="view-cashier">
      <div class="total-banner">
        <div>
          <div class="label">当前订单</div>
          <div class="amount"><span class="cur">¥</span><span id="totalAmt">0.00</span></div>
        </div>
        <div class="count"><b id="totalQty">0</b><br>件商品</div>
      </div>

      <button class="scan-btn" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M11 8v8M15 8v8M19 8v8"/></svg>
        扫码添加商品
      </button>

      <div class="manual-row">
        <input type="text" id="manualInput" placeholder="或手动输入商品编码" inputmode="numeric" onkeydown="if(event.key==='Enter'){manualAdd()}">
        <button onclick="manualAdd()">添加</button>
      </div>

      <div class="section-title">
        <h2>购物车</h2>
        <button class="clear" onclick="clearCart()">清空</button>
      </div>

      <div class="cart" id="cartList"></div>

      <div class="remark-box">
        <textarea id="remarkInput" placeholder="订单备注（可选）：如配送地址、客户要求、发票信息等" oninput="remark=this.value"></textarea>
      </div>
    </section>

    <!-- ===== 订单 ===== -->
    <section class="view" id="view-orders">
      <div class="stats">
        <div class="st"><div class="l">订单总数</div><div class="v" id="ordCount">0</div></div>
        <div class="st"><div class="l">营业总额</div><div class="v acc" id="ordSum">¥0</div></div>
      </div>
      <div class="toolbar">
        <button class="export xsl" onclick="exportExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13l2 2 4-4"/></svg>
          导出 Excel
        </button>
        <button class="export csv" onclick="exportCSV()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          导出 CSV
        </button>

  <div class="sheet">

    <div class="row"><span style="font-weight:700">应收金额</span><span class="v" style="color:var(--primary);font-size:18px">¥<span id="ckTotal">0.00</span></span></div>

      <button class="confirm" onclick="confirmOrder()">确认收款</button>

</div>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ====== 外部库（defer 异步加载，不阻塞界面逻辑）====== -->
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script defer src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
/* =========================================================
   内嵌商品数据库 —— 直接在此处编辑/增删商品
   字段：code 商品编码 | name 商品名称 | price 零售价
   ========================================================= */
const PRODUCTS = [
  { code: "6901028075138", name: "中华(软)香烟", price: 65.00 },
  { code: "6901028075145", name: "中华(硬)香烟", price: 45.00 },
  { code: "6901668000132", name: "可口可乐 330ml", price: 3.50 },
  { code: "6920202888813", name: "康师傅冰红茶 500ml", price: 4.00 },
  { code: "6921168509256", name: "农夫山泉 550ml", price: 2.00 },
  { code: "6924743919319", name: "乐事黄瓜味薯片 75g", price: 8.50 },
  { code: "6901285991219", name: "德芙丝滑牛奶巧克力 84g", price: 14.90 },
  { code: "6925303773106", name: "卫龙大面筋 65g", price: 3.50 },
  { code: "6907992100173", name: "统一老坛酸菜面 105g", price: 4.50 },
  { code: "6920734665023", name: "蒙牛纯牛奶 250ml", price: 3.20 },
  { code: "6925303772720", name: "伊利安慕希酸奶 200g", price: 5.50 },
  { code: "6901668006622", name: "雪碧 330ml", price: 3.00 },
  { code: "6902175001987", name: "红牛维生素饮料 250ml", price: 6.00 },
  { code: "6921168509027", name: "农夫山泉东方树叶 500ml", price: 5.00 },
  { code: "6901028075060", name: "玉溪(软)香烟", price: 23.00 },
  { code: "6901028200097", name: "利群(新版)香烟", price: 16.00 },
  { code: "6925921102195", name: "奥利奥原味夹心饼干 97g", price: 7.90 },
  { code: "6901826888022", name: "康师傅红烧牛肉面 105g", price: 4.50 },
  { code: "6920734603057", name: "旺旺雪饼 84g", price: 6.50 },
  { code: "6921168509287", name: "农夫山泉茶π 500ml", price: 5.50 },
  { code: "6901668002036", name: "美年达橙味汽水 330ml", price: 3.00 },
  { code: "6924743912013", name: "乐事原味薯片 50g", price: 5.50 },
  { code: "6907992100296", name: "统一阿萨姆奶茶 500ml", price: 5.00 },
  { code: "6925303772935", name: "农夫山泉苏打汽水 500ml", price: 4.50 },
  { code: "6901285991059", name: "士力架花生巧克力 51g", price: 4.50 },
];

/* =========================================================
   核心逻辑
   ========================================================= */
const productMap = new Map(PRODUCTS.map(p => [String(p.code), p]));

let cart = load('pos_cart', []);
let orders = load('pos_orders', []);
let remark = '';
let html5Qr = null;
let torchOn = false;
let lastScanCode = '';
let lastScanTime = 0;

function load(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function saveCart(){ localStorage.setItem('pos_cart', JSON.stringify(cart)); }
function saveOrders(){ localStorage.setItem('pos_orders', JSON.stringify(orders)); }

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toFixed(2);

/* ---------- 视图切换 ---------- */
function switchView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('view-'+v).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  // 结算条只在收银台显示
  $('checkoutBar').style.display = v==='cashier' ? 'flex' : 'none';
  if(v==='orders') renderOrders();
  if(v==='products') renderProducts();
}

/* ---------- 购物车 ---------- */
function addToCart(code, silent=false){
  code = String(code).trim();
  if(!code) return false;
  const p = productMap.get(code);
  if(!p){
    if(!silent) toast('未找到商品：'+code, 'err');
    return false;
  }
  const ex = cart.find(i=>i.code===p.code);
  if(ex){ ex.qty++; }
  else { cart.push({ code:p.code, name:p.name, price:p.price, qty:1 }); }
  saveCart();
  renderCart();
  if(!silent) toast('已添加：'+p.name, 'ok');
  return true;
}

function manualAdd(){
  const inp = $('manualInput');
  if(addToCart(inp.value)){ inp.value=''; }
}

function changeQty(idx, d){
  cart[idx].qty += d;
  if(cart[idx].qty <= 0){ cart.splice(idx,1); }
  saveCart();
  renderCart();
}

function setQty(idx, v){
  v = Math.max(1, parseInt(v)||1);
  cart[idx].qty = v;
  saveCart();
  renderCart();
}

function setPrice(idx, v){
  const p = parseFloat(v);
  if(!isNaN(p) && p>=0){
    cart[idx].price = p;
    saveCart();
    renderCart();
  }
}

function delItem(idx){
  cart.splice(idx,1);
  saveCart();
  renderCart();
}

function clearCart(){
  if(cart.length===0) return;
  if(confirm('确定清空购物车？')){
    cart = [];
    remark = '';
    $('remarkInput').value = '';
    saveCart();
    renderCart();
    toast('已清空购物车','info');
  }
}

function renderCart(){
  const list = $('cartList');
  if(cart.length===0){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <h3>购物车空空如也</h3><p>点击上方扫码或输入编码添加商品</p>
    </div>`;
  } else {
    list.innerHTML = cart.map((it,i)=>`
      <div class="cart-item">
        <div class="info">
          <div class="name">${esc(it.name)}</div>
          <div class="code">${esc(it.code)}</div>
          <div class="price-row">
            <span class="mono" style="font-size:11px;color:var(--muted)">¥</span>
            <input class="price-edit" type="number" step="0.01" min="0" value="${it.price.toFixed(2)}" onchange="setPrice(${i},this.value)">
            <div class="qty">
              <button onclick="changeQty(${i},-1)">−</button>
              <span>${it.qty}</span>
              <button onclick="changeQty(${i},1)">+</button>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="subtotal">¥${money(it.price*it.qty)}</div>
          <button class="del" onclick="delItem(${i})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }
  // 合计
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const qty = cart.reduce((s,i)=>s+i.qty,0);
  $('totalAmt').textContent = money(total);
  $('totalQty').textContent = qty;
  $('checkoutTotal').textContent = money(total);
  $('payBtn').disabled = cart.length===0;
}

/* ---------- 结算 ---------- */
function checkout(){
  if(cart.length===0){ toast('购物车为空','err'); return; }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const qty = cart.reduce((s,i)=>s+i.qty,0);
  $('ckQty').textContent = qty;
  $('ckKinds').textContent = cart.length;
  $('ckTotal').textContent = money(total);
  $('ckRemark').textContent = remark || '无';
  $('checkoutModal').classList.add('show');
}

function confirmOrder(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const order = {
    id: 'ORD' + new Date().toISOString().replace(/[-:T.Z]/g,'').slice(0,14),
    time: new Date().toISOString(),
    items: cart.map(i=>({...i})),
    total: total,
    qty: cart.reduce((s,i)=>s+i.qty,0),
    remark: remark || ''
  };
  orders.unshift(order);
  saveOrders();
  cart = [];
  remark = '';
  $('remarkInput').value = '';
  saveCart();
  renderCart();
  closeModal('checkoutModal');
  toast('订单 '+order.id+' 已完成','ok');
  if(navigator.vibrate) navigator.vibrate(30);
}

/* ---------- 订单列表 ---------- */
function renderOrders(){
  $('ordCount').textContent = orders.length;
  const sum = orders.reduce((s,o)=>s+o.total,0);
  $('ordSum').textContent = '¥'+money(sum);
  const list = $('ordersList');
  if(orders.length===0){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <h3>暂无订单</h3><p>完成的订单将显示在此处</p>
    </div>`;
    return;
  }
  list.innerHTML = orders.map((o,idx)=>{
    const d = new Date(o.time);
    const t = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const items = o.items.map(it=>`<div class="item"><span class="nm">${esc(it.name)}</span><span class="qt">×${it.qty}</span><span class="pr">¥${money(it.price*it.qty)}</span></div>`).join('');
    const rm = o.remark ? `<div class="rm"><b>备注：</b>${esc(o.remark)}</div>` : '';
    return `<div class="order-card" id="ord-${idx}">
      <div class="order-head" onclick="document.getElementById('ord-${idx}').classList.toggle('open')">
        <div>
          <div class="oid">${o.id}</div>
          <div class="time">${t} · ${o.items.length}种${o.qty}件</div>
        </div>
        <div class="total">¥${money(o.total)}</div>
        <div class="order-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div class="order-body">${items}${rm}</div>
    </div>`;
  }).join('');
}

function clearOrders(){
  if(orders.length===0){ toast('暂无订单','info'); return; }
  if(confirm('确定清空所有订单？此操作不可恢复！')){
    orders = [];
    saveOrders();
    renderOrders();
    toast('已清空所有订单','info');
  }
}

/* ---------- 导出 ---------- */
function buildExportData(){
  // 明细行
  const details = [];
  orders.forEach(o=>{
    const d = new Date(o.time);
    const t = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    o.items.forEach(it=>{
      details.push({
        '订单编号': o.id,
        '下单时间': t,
        '商品编码': it.code,
        '商品名称': it.name,
        '单价': Number(it.price.toFixed(2)),
        '数量': it.qty,
        '小计': Number((it.price*it.qty).toFixed(2)),
        '订单备注': o.remark || '',
        '订单总额': Number(o.total.toFixed(2))
      });
    });
  });
  return details;
}

function exportExcel(){
  if(orders.length===0){ toast('暂无订单可导出','err'); return; }
  const details = buildExportData();
  // 汇总
  const summary = orders.map(o=>{
    const d = new Date(o.time);
    const t = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    return {
      '订单编号': o.id,
      '下单时间': t,
      '商品种类': o.items.length,
      '商品件数': o.qty,
      '订单总额': Number(o.total.toFixed(2)),
      '备注': o.remark || ''
    };
  });
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summary);
  ws1['!cols'] = [{wch:18},{wch:20},{wch:8},{wch:8},{wch:12},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws1, '订单汇总');
  const ws2 = XLSX.utils.json_to_sheet(details);
  ws2['!cols'] = [{wch:18},{wch:20},{wch:16},{wch:22},{wch:8},{wch:6},{wch:10},{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws2, '订单明细');
  const fn = `收银订单_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fn);
  toast('已导出 '+fn,'ok');
}

function exportCSV(){
  if(orders.length===0){ toast('暂无订单可导出','err'); return; }
  const details = buildExportData();
  const keys = Object.keys(details[0]);
  // 加 BOM 防止 Excel 中文乱码
  const csv = '\ufeff' + keys.join(',') + '\n' + details.map(r=>
    keys.map(k=>{
      const v = r[k]===null||r[k]===undefined ? '' : String(r[k]);
      return v.includes(',')||v.includes('"')||v.includes('\n') ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `收银订单_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 CSV','ok');
}

/* ---------- 商品列表 ---------- */
function renderProducts(){
  const kw = ($('prodSearch').value||'').trim().toLowerCase();
  const list = kw ? PRODUCTS.filter(p=>p.name.toLowerCase().includes(kw)||String(p.code).includes(kw)) : PRODUCTS;
  $('prodNum').textContent = list.length;
  $('prodList').innerHTML = list.map(p=>`
    <div class="prod-card">
      <div class="pd">
        <div class="pn">${esc(p.name)}</div>
        <div class="pc">${esc(p.code)}</div>
      </div>
      <div class="pp">¥${money(p.price)}</div>
      <button class="add" onclick="addToCart('${p.code}');switchView('cashier')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  `).join('');
}

/* ---------- 扫码 ---------- */
async function startScan(){
  if(typeof Html5Qrcode === 'undefined'){
    toast('扫码库加载中，请稍后重试','err');
    return;
  }
  $('scanModal').classList.add('show');
  try{
    html5Qr = new Html5Qrcode('camWrap', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE,
      ],
      verbose: false
    });
    const config = {
      fps: 12,
      qrbox: (vw,vh)=>({ width: Math.floor(vw*0.8), height: Math.floor(vh*0.35) }),
      aspectRatio: window.innerHeight/window.innerWidth,
    };
    await html5Qr.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      ()=>{}
    );
    toast('摄像头已启动','info');
  }catch(e){
    console.error(e);
    $('scanModal').classList.remove('show');
    toast('无法启动摄像头，请检查权限设置','err');
  }
}

function onScanSuccess(decoded){
  // 防重复扫描（同一编码1秒内只触发一次）
  const now = Date.now();
  if(decoded===lastScanCode && now-lastScanTime < 1200) return;
  lastScanCode = decoded;
  lastScanTime = now;
  if(navigator.vibrate) navigator.vibrate(50);
  if(addToCart(decoded, true)){
    toast('已扫码：'+productMap.get(String(decoded).trim()).name,'ok');
  } else {
    toast('未找到商品：'+decoded,'err');
  }
}

async function stopScan(){
  if(html5Qr){
    try{
      await html5Qr.stop();
      html5Qr.clear();
    }catch(e){}
    html5Qr = null;
  }
  torchOn = false;
  $('torchLabel').textContent = '手电筒';
  $('scanModal').classList.remove('show');
}

async function toggleTorch(){
  if(!html5Qr) return;
  try{
    const tracks = html5Qr.getRunningTrackCameraCapabilities();
    // 尝试切换手电筒
    const stream = document.querySelector('#camWrap video')?.srcObject;
    if(stream){
      const track = stream.getVideoTracks()[0];
      const cap = track.getCapabilities();
      if(cap.torch){
        torchOn = !torchOn;
        track.applyConstraints({ advanced:[{ torch: torchOn }] });
        $('torchLabel').textContent = torchOn ? '关闭手电' : '手电筒';
      } else {
        toast('设备不支持手电筒','info');
      }
    }
  }catch(e){
    toast('手电筒切换失败','err');
  }
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function closeModal(id){ $(id).classList.remove('show'); }

function toast(msg, type='info'){
  const w = $('toastWrap');
  const icons = {
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>',
    err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="10"/></svg>'
  };
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = (icons[type]||'')+'<span>'+esc(msg)+'</span>';
  w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-8px)'; setTimeout(()=>t.remove(),300); }, 1800);
}

/* ---------- 时钟 ---------- */
function tick(){
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(tick,1000); tick();

renderProducts();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
