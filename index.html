<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<title>便携收银台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M58 56v80M78 56v80M98 56v80M118 56v80M138 56v80'/%3E%3C/g%3E%3C/svg%3E">
<!-- 使用系统字体，避免 Google Fonts 在国内被墙导致页面卡住 -->
<!-- 商品数据（1381个商品，由Excel导入生成） -->
<script src="./products.js"></script>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --ink:#0c1726;
  --ink-2:#3b4a5f;
  --muted:#8294a6;
  --line:#e7edf3;
  --primary:#0f766e;
  --primary-d:#0b5651;
  --primary-soft:#d3f0ec;
  --accent:#f59e0b;
  --accent-d:#d97706;
  --danger:#e5484d;
  --danger-soft:#fde8e8;
  --ok:#16a34a;
  --shadow:0 2px 10px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.16);
  --radius:18px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:"SF Mono","JetBrains Mono","Consolas","Monaco",monospace;font-feature-settings:"tnum"}
.display{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);
  color:#fff;
}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.topbar .logo svg{width:18px;height:18px}
.topbar h1{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;letter-spacing:.5px}
.topbar .tag{font-size:11px;opacity:.8;font-weight:500}
.topbar .clock{font-family:"SF Mono","Consolas","Monaco",monospace;font-size:13px;opacity:.9;font-weight:500}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.view{display:none;padding:16px}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 收银台 ============ */
.total-banner{
  background:var(--surface);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.total-banner::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 40%,var(--primary-soft) 100%);
  opacity:.5;
}
.total-banner>div{position:relative}
.total-banner .label{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:1px;text-transform:uppercase}
.total-banner .amount{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;color:var(--primary);line-height:1.1;margin-top:4px}
.total-banner .amount .cur{font-size:18px;font-weight:600;opacity:.7;margin-right:3px}
.total-banner .count{font-size:13px;color:var(--ink-2);text-align:right}
.total-banner .count b{font-family:"SF Mono","Consolas","Monaco",monospace;font-size:22px;color:var(--ink);font-weight:700}

.scan-btn{
  width:100%;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);
  color:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:17px;font-weight:700;letter-spacing:1px;
  box-shadow:0 8px 22px rgba(15,118,110,.32);
  transition:transform .12s;
  margin-bottom:12px;
}
.scan-btn:active{transform:scale(.97)}
.scan-btn svg{width:22px;height:22px}

.manual-row{display:flex;gap:8px;margin-bottom:18px}
.manual-row input{
  flex:1;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;background:var(--surface);outline:none;transition:border .15s;
}
.manual-row input:focus{border-color:var(--primary)}
.manual-row button{
  padding:0 18px;background:var(--ink);color:#fff;border-radius:12px;
  font-weight:600;font-size:14px;white-space:nowrap;
}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
.section-title h2{font-size:14px;color:var(--ink-2);font-weight:600;letter-spacing:.5px}
.section-title .clear{font-size:12px;color:var(--danger);padding:4px 8px}

.cart{display:flex;flex-direction:column;gap:10px}
.cart-item{
  background:var(--surface);border-radius:14px;padding:14px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:stretch;
  animation:slidein .25s ease;
}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cart-item .info{flex:1;min-width:0}
.cart-item .name{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .code{font-size:11px;color:var(--muted);font-family:"SF Mono","Consolas","Monaco",monospace}
.cart-item .price-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.price-edit{
  border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;
  font-family:"SF Mono","Consolas","Monaco",monospace;font-size:15px;font-weight:700;color:var(--primary);
  width:90px;text-align:right;outline:none;background:#fff;
}
.price-edit:focus{border-color:var(--primary)}
.cart-item .qty{display:flex;align-items:center;gap:0;background:var(--bg);border-radius:8px;overflow:hidden}
.cart-item .qty button{width:30px;height:30px;font-size:16px;font-weight:700;color:var(--ink-2);display:grid;place-items:center}
.cart-item .qty button:active{background:var(--line)}
.cart-item .qty span{min-width:28px;text-align:center;font-family:"SF Mono","Consolas","Monaco",monospace;font-weight:700;font-size:14px}
.cart-item .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.cart-item .subtotal{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:16px;color:var(--ink)}
.cart-item .del{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--danger);background:var(--danger-soft)}
.cart-item .del:active{transform:scale(.9)}
.cart-item .del svg{width:16px;height:16px}

.remark-box{margin-top:16px}
.remark-box textarea{
  width:100%;min-height:60px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:14px;background:var(--surface);outline:none;resize:none;font-family:inherit;
}
.remark-box textarea:focus{border-color:var(--primary)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.4;margin-bottom:14px}
.empty h3{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.empty p{font-size:13px}

/* ============ 结算条 ============ */
.checkout-bar{
  position:absolute;bottom:56px;left:0;right:0;max-width:560px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px;padding-bottom:max(12px,calc(var(--safe-bottom) + 0px));
  display:flex;gap:12px;align-items:center;
  box-shadow:0 -4px 20px rgba(15,23,42,.08);
  z-index:20;
}
.checkout-bar .total{flex:1}
.checkout-bar .total .l{font-size:11px;color:var(--muted)}
.checkout-bar .total .v{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;font-size:22px;color:var(--primary)}
.checkout-bar .pay-btn{
  padding:14px 28px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);
  color:#fff;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 18px rgba(245,158,11,.4);transition:transform .12s;
}
.checkout-bar .pay-btn:active{transform:scale(.96)}
.checkout-bar .pay-btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-bottom);z-index:30;
}
.bottom-nav button{
  flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:500;transition:color .15s;
}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active svg{transform:translateY(-1px)}

/* ============ 订单页 ============ */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .export{flex:1;min-width:130px;padding:12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);border:1.5px solid var(--line)}
.toolbar .export:active{transform:scale(.97)}
.toolbar .export svg{width:17px;height:17px}
.toolbar .export.xsl{color:#16a34a;border-color:#bbf7d0}
.toolbar .export.csv{color:#2563eb;border-color:#bfdbfe}
.toolbar .export.clear{color:var(--danger);border-color:#fecaca;flex:0 0 auto;padding:12px 14px}

.orders{display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.order-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.order-head .oid{font-family:"SF Mono","Consolas","Monaco",monospace;font-size:11px;color:var(--muted)}
.order-head .time{font-size:13px;font-weight:600;color:var(--ink-2)}
.order-head .total{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;font-size:18px;color:var(--primary)}
.order-body{padding:0 16px 14px;display:none;border-top:1px dashed var(--line)}
.order-card.open .order-body{display:block;padding-top:12px}
.order-body .item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-2)}
.order-body .item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.order-body .item .qt{color:var(--muted);font-family:"SF Mono","Consolas","Monaco",monospace}
.order-body .item .pr{font-family:"SF Mono","Consolas","Monaco",monospace;font-weight:600;color:var(--ink);min-width:70px;text-align:right}
.order-body .rm{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--ink-2)}
.order-body .rm b{color:var(--accent-d)}
.order-toggle{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.order-card.open .order-toggle{transform:rotate(180deg)}
.order-toggle svg{width:16px;height:16px}

.stats{display:flex;gap:10px;margin-bottom:14px}
.stats .st{flex:1;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stats .st .l{font-size:11px;color:var(--muted);font-weight:500}
.stats .st .v{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin-top:2px}
.stats .st .v.acc{color:var(--primary)}

/* ============ 商品页 ============ */
.search-row{position:relative;margin-bottom:14px}
.search-row svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search-row input{width:100%;padding:13px 16px 13px 42px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--surface);outline:none}
.search-row input:focus{border-color:var(--primary)}
.prod-count{font-size:12px;color:var(--muted);margin:0 4px 10px}
.prod-count b{color:var(--ink-2);font-family:"SF Mono","Consolas","Monaco",monospace}
.products{display:flex;flex-direction:column;gap:8px}
.prod-card{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.prod-card .pd{flex:1;min-width:0}
.prod-card .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card .pc{font-size:11px;color:var(--muted);font-family:"SF Mono","Consolas","Monaco",monospace;margin-top:1px}
.prod-card .pp{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:17px;color:var(--primary)}
.prod-card .add{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.prod-card .add:active{transform:scale(.9)}
.prod-card .add svg{width:18px;height:18px}

/* ============ 扫码弹窗 ============ */
.scan-modal{
  position:fixed;inset:0;background:#000;z-index:100;display:none;
  flex-direction:column;
}
.scan-modal.show{display:flex}
.scan-modal .cam-wrap{flex:1;position:relative;overflow:hidden}
.scan-modal .cam{width:100%;height:100%;position:relative;overflow:hidden}
.scan-modal .cam video,.scan-modal .cam canvas{width:100%!important;height:100%!important;object-fit:cover}
.scan-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.9);font-size:14px;text-align:center;
  display:none;flex-direction:column;align-items:center;gap:16px;
}
.scan-loading.show{display:flex}
.scan-spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-frame{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80%;height:35%;max-width:340px;
  border-radius:14px;
}
.scan-frame::before,.scan-frame::after{
  content:"";position:absolute;width:34px;height:34px;border:4px solid var(--accent);
}
.scan-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
.scan-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 14px 0}
.scan-frame .laser{
  position:absolute;left:8%;right:8%;height:2px;background:var(--accent);
  box-shadow:0 0 12px var(--accent);animation:laser 1.8s ease-in-out infinite;
}
@keyframes laser{0%,100%{top:12%}50%{top:88%}}
.scan-modal .top-bar{position:absolute;top:0;left:0;right:0;padding:max(16px,env(safe-area-inset-top)) 18px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.scan-modal .top-bar .tt{color:#fff;font-weight:600;font-size:16px}
.scan-modal .top-bar .close{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px)}
.scan-modal .top-bar .close svg{width:18px;height:18px}
.scan-modal .hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px}
.scan-modal .torch{position:absolute;bottom:max(80px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 22px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:24px;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.scan-modal .torch svg{width:16px;height:16px}

/* ============ Toast ============ */
.toast-wrap{position:fixed;top:max(70px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:max-content;max-width:90%}
.toast{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:tin .3s ease}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
.toast.info{background:var(--ink)}
.toast svg{width:17px;height:17px}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ============ Modal ============ */
.modal-bg{position:fixed;inset:0;background:rgba(12,23,38,.5);z-index:150;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px;padding-bottom:max(20px,calc(var(--safe-bottom) + 20px));animation:sup .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.sheet .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet .row:last-of-type{border-bottom:none}
.sheet .row .v{font-family:"SF Mono","Consolas","Monaco",monospace;font-weight:700;color:var(--ink)}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:15px}
.sheet .cancel{background:var(--bg);color:var(--ink-2)}
.sheet .confirm{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);color:#fff}
.sheet .confirm:active{transform:scale(.97)}

.hidden{display:none!important}

/* ============ 订单操作按钮 ============ */
.order-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.order-actions button{
  flex:1;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s;
}
.order-actions button:active{transform:scale(.96)}
.order-actions .edit-btn{background:var(--primary-soft);color:var(--primary)}
.order-actions .del-btn{background:var(--danger-soft);color:var(--danger)}
.order-actions button svg{width:16px;height:16px}

/* ============ 编辑订单弹窗 ============ */
#editOrderModal .sheet{max-width:640px;max-height:85vh;display:flex;flex-direction:column}
.edit-order-body{flex:1;overflow-y:auto;padding-right:4px}
.edit-order-body .item-row{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line);
}
.edit-order-body .item-row:last-child{border-bottom:none}
.edit-order-body .item-info{flex:1;min-width:0}
.edit-order-body .item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-order-body .item-code{font-size:11px;color:var(--muted);font-family:"SF Mono","Consolas","Monaco",monospace}
.edit-order-body .item-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.edit-order-body .price-input{
  width:80px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;
  font-family:"SF Mono","Consolas","Monaco",monospace;font-size:14px;font-weight:700;color:var(--primary);
  text-align:right;outline:none;background:#fff;
}
.edit-order-body .price-input:focus{border-color:var(--primary)}
.edit-order-body .qty-ctrl{display:flex;align-items:center;background:var(--bg);border-radius:8px;overflow:hidden}
.edit-order-body .qty-ctrl button{
  width:32px;height:32px;font-size:16px;font-weight:700;color:var(--ink-2);display:grid;place-items:center
}
.edit-order-body .qty-ctrl button:active{background:var(--line)}
.edit-order-body .qty-ctrl span{min-width:24px;text-align:center;font-family:"SF Mono","Consolas","Monaco",monospace;font-weight:700;font-size:13px}

<script>
/* =========================================================
   商品数据已移至外部文件 products.js (1381个商品)
   ========================================================= */

/* =========================================================
   核心逻辑
   ========================================================= */
// 安全检查：如果 products.js 加载失败，使用空数组防止整个程序崩溃
if (typeof PRODUCTS === 'undefined') {
  console.error('商品数据文件 products.js 加载失败，请检查文件是否存在');
  window.PRODUCTS = [];
}

const productMap = new Map(PRODUCTS.map(p => [String(p.code), p]));

let cart = safeLoad('pos_cart', []);
let orders = safeLoad('pos_orders', []);
let remark = '';
let html5Qr = null;
let torchOn = false;
let lastScanCode = '';
let lastScanTime = 0;

// 安全读取 localStorage，防止 JSON 解析失败导致崩溃
function safeLoad(k, def){
  try{
    const v = localStorage.getItem(k);
    if(!v) return def;
    const parsed = JSON.parse(v);
    return Array.isArray(def) ? (Array.isArray(parsed) ? parsed : def) : parsed;
  }catch(e){
    console.warn('数据读取失败，使用默认值:', k, e);
    try{ localStorage.removeItem(k); }catch(e2){}
    return def;
  }
}

// 安全写入 localStorage，带防抖和容量保护
// 每个key独立防抖，防止 cart 和 orders 的保存互相覆盖
const saveTimers = {};
function safeSave(k, v){
  if(saveTimers[k]) clearTimeout(saveTimers[k]);
  saveTimers[k] = setTimeout(()=>{
    try{
      const data = JSON.stringify(v);
      // 检查数据大小，超过 4MB 时清理旧订单
      if(data.length > 4 * 1024 * 1024 && k === 'pos_orders'){
        // 只保留最近 500 条订单
        const trimmed = v.slice(-500);
        localStorage.setItem(k, JSON.stringify(trimmed));
        console.warn('订单数据过大，已自动保留最近500条');
      } else {
        localStorage.setItem(k, data);
      }
    }catch(e){
      console.error('数据保存失败:', e);
      // 如果存储已满，尝试清理后重试
      if(e.name === 'QuotaExceededError'){
        try{
          localStorage.removeItem('pos_cart');
          localStorage.setItem(k, JSON.stringify(v));
        }catch(e2){
          console.error('存储空间不足，无法保存');
        }
      }
    }
    saveTimers[k] = null;
  }, 300);
}

function saveCart(){ safeSave('pos_cart', cart); }
function saveOrders(){ safeSave('pos_orders', orders); }

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toFixed(2);

/* ---------- 视图切换 ---------- */
function switchView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('view-'+v).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  // 结算条只在收银台显示
  $('checkoutBar').style.display = v==='cashier' ? 'flex' : 'none';
  if(v==='orders') renderOrders();
  if(v==='products') renderProducts();
}

/* ---------- 购物车 ---------- */
function addToCart(code, silent=false){
  code = String(code).trim();
  if(!code) return false;
  // 查找商品：先精确匹配，再尝试去除前导零匹配
  let p = productMap.get(code);
  if(!p){
    // 尝试去除前导零后匹配（有些扫码器会补零）
    p = productMap.get(code.replace(/^0+/, ''));
  }
  if(!p){
    // 尝试在所有商品中查找包含该编码的
    p = PRODUCTS.find(x => String(x.code) === code || String(x.code).replace(/^0+/,'') === code.replace(/^0+/,''));
  }
  if(!p){
    if(!silent) toast('未找到商品：'+code, 'err');
    return false;
  }
  const ex = cart.find(i=>i.code===p.code);
  if(ex){ ex.qty++; }
  else { cart.push({ code:p.code, name:p.name, price:p.price, qty:1 }); }
  saveCart();
  renderCart();
  if(!silent) toast('已添加：'+p.name, 'ok');
  return true;
}

function manualAdd(){
  const inp = $('manualInput');
  if(addToCart(inp.value)){ inp.value=''; }
}

function changeQty(idx, d){
  cart[idx].qty += d;
  if(cart[idx].qty <= 0){ cart.splice(idx,1); }
  saveCart();
  renderCart();
}

function setQty(idx, v){
  v = Math.max(1, parseInt(v)||1);
  cart[idx].qty = v;
  saveCart();
  renderCart();
}

function setPrice(idx, v){
  const p = parseFloat(v);
  if(!isNaN(p) && p>=0){
    cart[idx].price = p;
    saveCart();
    renderCart();
  }
}

function delItem(idx){
  cart.splice(idx,1);
  saveCart();
  renderCart();
}

function clearCart(){
  if(cart.length===0) return;
  if(confirm('确定清空购物车？')){
    cart = [];
    remark = '';
    $('remarkInput').value = '';
    saveCart();
    renderCart();
    toast('已清空购物车','info');
  }
}

function renderCart(){
  const list = $('cartList');
  if(cart.length===0){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <h3>购物车空空如也</h3><p>点击上方扫码或输入编码添加商品</p>
    </div>`;
  } else {
    list.innerHTML = cart.map((it,i)=>`
      <div class="cart-item">
        <div class="info">
          <div class="name">${esc(it.name)}</div>
          <div class="code">${esc(it.code)}</div>
          <div class="price-row">
            <span class="mono" style="font-size:11px;color:var(--muted)">¥</span>
            <input class="price-edit" type="number" step="0.01" min="0" value="${it.price.toFixed(2)}" onchange="setPrice(${i},this.value)">
            <div class="qty">
              <button onclick="changeQty(${i},-1)">−</button>
              <span>${it.qty}</span>
              <button onclick="changeQty(${i},1)">+</button>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="subtotal">¥${money(it.price*it.qty)}</div>
          <button class="del" onclick="delItem(${i})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>
      </div>

let editingOrderData = null;

function updateEditOrderTotal(){
  const total = editingOrderData.items.reduce((s,i)=>s+i.price*i.qty,0);

}

function editOrderChangeQty(i, d){
  editingOrderData.items[i].qty += d;
  if(editingOrderData.items[i].qty <= 0){
    editingOrderData.items.splice(i,1);
  }
  renderEditOrderBody();
}

function editOrderSetPrice(i, v){
  const p = parseFloat(v);
  if(!isNaN(p) && p>=0){
    editingOrderData.items[i].price = p;
    renderEditOrderBody();
  }
}

function editOrderRemoveItem(i){
  editingOrderData.items.splice(i,1);
  renderEditOrderBody();
}

function cancelEditOrder(){
  editingOrderIdx = -1;
  editingOrderData = null;
  closeModal('editOrderModal');
}

function saveOrderEdit(){
  if(editingOrderIdx < 0 || !editingOrderData) return;
  const items = editingOrderData.items;
  if(items.length===0){
    toast('订单至少需要一个商品','err');
    return;
  }
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const qty = items.reduce((s,i)=>s+i.qty,0);
  orders[editingOrderIdx].items = items;
  orders[editingOrderIdx].total = total;
  orders[editingOrderIdx].qty = qty;
  orders[editingOrderIdx].remark = $('editOrderRemark').value || '';
  saveOrders();
  renderOrders();
  cancelEditOrder();
  toast('订单已更新','ok');
}

function deleteOrder(idx){
  if(idx < 0 || idx >= orders.length) return;

function exportCSV(){
  if(orders.length===0){ toast('暂无订单可导出','err'); return; }
  const details = buildExportData();
  const keys = Object.keys(details[0]);
  // 加 BOM 防止 Excel 中文乱码
  const csv = '\ufeff' + keys.join(',') + '\n' + details.map(r=>
    keys.map(k=>{
      const v = r[k]===null||r[k]===undefined ? '' : String(r[k]);
      return v.includes(',')||v.includes('"')||v.includes('\n') ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `收银订单_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 CSV','ok');
}

/* ---------- 扫码 ---------- */

// 等待库加载
function waitForLibrary(maxWait){
  return new Promise((resolve)=>{
    if(typeof Html5Qrcode !== 'undefined'){ resolve(true); return; }
    const start = Date.now();
    const timer = setInterval(()=>{
      if(typeof Html5Qrcode !== 'undefined'){
        clearInterval(timer);
        resolve(true);
      } else if(Date.now()-start > (maxWait||8000)){
        clearInterval(timer);
        resolve(false);
      }
    }, 200);
  });
}

async function startScan(){
  $('scanModal').classList.add('show');
  $('scanLoading').classList.add('show');

  // 优先使用原生 BarcodeDetector API（更灵敏、不依赖外部库）
  if('BarcodeDetector' in window){
    try{
      await startNativeScan();
      return;
    }catch(e){
      console.warn('BarcodeDetector 启动失败，回退到 html5-qrcode:', e);
    }
  }

  // 回退到 html5-qrcode
  const loaded = await waitForLibrary(8000);
  if(!loaded){
    $('scanLoading').classList.remove('show');
    $('scanModal').classList.remove('show');
    toast('扫码库加载失败，请检查网络后重试','err');
    return;
  }

  if(html5Qr){
    try{ await html5Qr.stop(); html5Qr.clear(); }catch(e){}
    html5Qr = null;
  }

  try{
    html5Qr = new Html5Qrcode('camWrap', { verbose: false });

    const config = {
      fps: 20,
      qrbox: function(vw, vh){
        var w = Math.floor(vw * 0.6);
        var h = Math.floor(vh * 0.15);
        if(w < 120) w = 180;
        if(h < 50) h = 60;
        return { width: w, height: h };
      },
      aspectRatio: 1.0,
      videoConstraints: {
        facingMode: 'environment',
        width: { min: 640, ideal: 1920 },
        height: { min: 480, ideal: 1080 }
      }
    };

    await html5Qr.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      function(err){}
    );

    $('scanLoading').classList.remove('show');
    toast('摄像头已启动，对准条形码即可','info');
  }catch(e){
    console.error('摄像头启动失败:', e);
    $('scanLoading').classList.remove('show');
    $('scanModal').classList.remove('show');
    let msg = '无法启动摄像头';
    if(e && e.message){
      if(e.message.includes('Permission') || e.message.includes('NotAllowed')){
        msg = '摄像头权限被拒绝，请在浏览器设置中允许';
      } else if(e.message.includes('NotFound') || e.message.includes('NotReadable')){
        msg = '未找到摄像头设备';
      } else if(e.message.includes('Insecure')){
        msg = '需要 HTTPS 环境才能使用摄像头';
      }
    }
    toast(msg, 'err');
    html5Qr = null;
  }
}

// ====== 原生 BarcodeDetector 扫码（更灵敏）======
let nativeScanStream = null;
let nativeScanRunning = false;

async function startNativeScan(){
  const formats = await BarcodeDetector.getSupportedFormats();
  const supported = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf']
    .filter(f => formats.includes(f));

  const detector = new BarcodeDetector({ formats: supported.length ? supported : undefined });

  nativeScanStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    }
  });

  const video = document.createElement('video');
  video.srcObject = nativeScanStream;
  video.playsInline = true;
  video.muted = true;
  video.style.cssText = 'width:100%;height:100%;object-fit:cover';
  $('camWrap').innerHTML = '';
  $('camWrap').appendChild(video);
  await video.play();

  $('scanLoading').classList.remove('show');
  toast('摄像头已启动，对准条形码即可','info');

  nativeScanRunning = true;
  scanLoop(detector, video);
}

async function scanLoop(detector, video){
  if(!nativeScanRunning) return;
  try{
    const barcodes = await detector.detect(video);
    if(barcodes && barcodes.length > 0){
      for(const b of barcodes){
        if(b.rawValue){
          onScanSuccess(b.rawValue);
          break;
        }
      }
    }
  }catch(e){}
  // 降速扫描：每 500ms 检测一次，防止同一商品被重复识别
  setTimeout(()=>scanLoop(detector, video), 500);
}

function stopNativeScan(){
  nativeScanRunning = false;
  if(nativeScanStream){
    nativeScanStream.getTracks().forEach(t=>t.stop());
    nativeScanStream = null;
  }
}

function onScanSuccess(decoded){
  // 全局冷却：上次扫码后 1.5 秒内不响应任何扫码，防止同一商品被重复添加
  const now = Date.now();
  if(now - lastScanTime < 1500) return;
  // 相同编码额外冷却 2 秒
  if(decoded === lastScanCode && now - lastScanTime < 2000) return;
  lastScanCode = decoded;
  lastScanTime = now;
  if(navigator.vibrate) navigator.vibrate(50);

  // 从扫描结果中提取以69开头的数字串
  const code = extractBarcode(decoded);
  if(!code){
    // 扫到了内容但不是有效的69开头条码，重置冷却允许立即重扫
    lastScanTime = 0;
    return;
  }

  if(addToCart(code, true)){
    const item = cart.find(i => String(i.code) === code || String(i.code).replace(/^0+/,'') === code.replace(/^0+/,''));
    toast('已添加：' + (item ? item.name : code), 'ok');
    playBeep();
  } else {
    toast('未找到商品：' + code, 'err');
  }
}

// 扫码成功音效（叮咚）
let audioCtx = null;
function playBeep(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // 如果上下文被暂停（移动端自动播放策略），先恢复
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    // 生成"叮咚"两音效果
    const t = audioCtx.currentTime;
    // 第一个音：高音"叮"
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.value = 880;
    gain1.gain.setValueAtTime(0, t);
    gain1.gain.linearRampToValueAtTime(0.3, t + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc1.connect(gain1).connect(audioCtx.destination);
    osc1.start(t);
    osc1.stop(t + 0.2);
    // 第二个音：低音"咚"
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = 660;
    gain2.gain.setValueAtTime(0, t + 0.1);
    gain2.gain.linearRampToValueAtTime(0.25, t + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc2.connect(gain2).connect(audioCtx.destination);
    osc2.start(t + 0.1);
    osc2.stop(t + 0.4);
  }catch(e){
    // 音频不可用，静默忽略
  }
}

// 从扫描结果中提取以69开头的纯数字条码
// 处理扫码器可能带入的额外文字、URL前缀等干扰内容
function extractBarcode(raw){
  if(!raw) return null;
  var s = String(raw).trim();

  // 1. 如果是纯数字，直接使用
  if(/^\d+$/.test(s)) return s;

  // 2. 从字符串中提取所有连续数字段（长度>=8），优先找69开头的
  var matches = s.match(/\d{8,}/g);
  if(matches){
    // 优先找69开头的
    for(var i=0; i<matches.length; i++){
      if(matches[i].indexOf('69') === 0) return matches[i];
    }
    // 没有69开头的，取最长的数字串
    matches.sort(function(a,b){ return b.length - a.length; });
    return matches[0];
  }

  // 3. 尝试提取较短的数字串（6-7位），可能在条码被部分识别时有用
  var shortMatches = s.match(/\d{6,}/g);
  if(shortMatches){
    for(var i=0; i<shortMatches.length; i++){
      if(shortMatches[i].indexOf('69') === 0) return shortMatches[i];
    }
  }

  // 4. 如果包含69开头的子串，尝试提取
  var idx = s.indexOf('69');
  if(idx >= 0){
    var sub = '';
    for(var i=idx; i<s.length; i++){
      if(s[i] >= '0' && s[i] <= '9') sub += s[i];
      else if(sub.length >= 8) break;
      else sub = '';
    }
    if(sub.length >= 8) return sub;
  }

  return null;
}

async function stopScan(){
  // 停止原生扫码
  stopNativeScan();
  // 停止 html5-qrcode
  if(html5Qr){
    try{
      await html5Qr.stop();
      html5Qr.clear();
    }catch(e){}
    html5Qr = null;
  }
  torchOn = false;
  $('torchLabel').textContent = '手电筒';
  $('scanLoading').classList.remove('show');
  $('scanModal').classList.remove('show');
  // 清空摄像头容器
  $('camWrap').innerHTML = '';
}

async function toggleTorch(){
  // 获取当前活跃的视频流（原生或 html5-qrcode）
  let stream = null;
  if(nativeScanStream){
    stream = nativeScanStream;
  } else {
    const video = document.querySelector('#camWrap video');
    stream = video?.srcObject;
  }
  if(!stream) return;
  try{
    const track = stream.getVideoTracks()[0];
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    if(cap.torch){
      torchOn = !torchOn;
      await track.applyConstraints({ advanced:[{ torch: torchOn }] });
      $('torchLabel').textContent = torchOn ? '关闭手电' : '手电筒';
    } else {
      toast('设备不支持手电筒','info');
    }
  }catch(e){
    toast('手电筒切换失败','err');
  }
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function closeModal(id){ $(id).classList.remove('show'); }

function toast(msg, type='info'){
  const w = $('toastWrap');
  const icons = {
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>',
    err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="10"/></svg>'
  };
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = (icons[type]||'')+'<span>'+esc(msg)+'</span>';
  w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-8px)'; setTimeout(()=>t.remove(),300); }, 1800);
}

/* ---------- 时钟 ---------- */
function tick(){
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(tick,1000); tick();

/* ---------- 全局错误处理 ---------- */
window.addEventListener('error', function(e){
  console.error('运行时错误:', e.error || e.message);
  // 防止未捕获的错误导致页面白屏
  return true;
});

window.addEventListener('unhandledrejection', function(e){
  console.error('未处理的Promise错误:', e.reason);
  e.preventDefault();
});

// 页面恢复可见时重新同步数据，防止多标签页数据不一致
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){
    // 重新读取数据（可能在其他标签页中被修改）
    try{
      const newOrders = safeLoad('pos_orders', []);
      if(newOrders.length !== orders.length){
        orders = newOrders;
        renderOrders();
      }
    }catch(e){}
  }
});

// 存储事件监听：其他标签页修改数据时自动同步
window.addEventListener('storage', function(e){
  if(e.key === 'pos_orders'){
    try{
      orders = safeLoad('pos_orders', []);
      renderOrders();
    }catch(e2){}
  }
});

/* ---------- 初始化 ---------- */
try{
  renderCart();
  renderOrders();
  renderProducts();
}catch(e){
  console.error('初始化失败:', e);
  // 出错时重置数据
  cart = [];
  orders = [];
  renderCart();
  renderOrders();
}

// 注册 Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
